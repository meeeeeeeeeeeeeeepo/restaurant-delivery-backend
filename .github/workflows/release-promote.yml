name: Release — promote staging to production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.2.0)"
        required: true
        default: v1.1.0
  repository_dispatch:
    types: [promote-to-prod]   # fired from Slack ("Promote to Production" workflow)

permissions:
  contents: write
  pull-requests: write

jobs:
  open-release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version + who triggered it
        id: meta
        run: |
          ver='${{ github.event.inputs.version || github.event.client_payload.version }}'
          [ -z "$ver" ] && ver="v1.1.0"
          who='${{ github.event.client_payload.requested_by || github.actor }}'
          echo "version=$ver" >> $GITHUB_OUTPUT
          echo "who=$who" >> $GITHUB_OUTPUT
          echo "Promotion requested by $who for $ver (event: ${{ github.event_name }})"

      - name: Open release PR (develop → main)
        run: |
          body="Automated **release ${{ steps.meta.outputs.version }}** promoting the validated staging build on \`develop\` to production (\`main\`), requested by **${{ steps.meta.outputs.who }}** via Slack.\n\nMerging this PR (after code review) cuts the release and triggers the production deploy."
          resp=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d "{\"title\":\"Release ${{ steps.meta.outputs.version }}: promote staging → production\",\"head\":\"develop\",\"base\":\"main\",\"body\":\"$body\"}")
          num=$(echo "$resp" | jq -r '.number // empty')
          url=$(echo "$resp" | jq -r '.html_url // empty')
          if [ -z "$url" ]; then
            echo "No release PR opened: $(echo "$resp" | jq -r '.message // (.errors|tostring)')"
          else
            echo "Opened release PR #$num: $url"
            curl -sf -X POST -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/issues/$num/labels \
              -d '{"labels":["release"]}' || true
          fi
