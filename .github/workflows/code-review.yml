name: Code Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  request-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Label PR as needs-review
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels \
            -d '{"labels":["needs-review"]}' || true

      - name: Ring code review (comment the bot relays to Slack #code-review)
        run: |
          base='${{ github.event.pull_request.base.ref }}'
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments \
            -d "{\"body\":\"🔔 **Code review requested.** This PR targets \`$base\` and needs at least one approving review + green CI before it can merge. Reviewers, please take a look.\"}"

  verify:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Code Review gate — CI must be green and an approval is required by branch protection on main."
