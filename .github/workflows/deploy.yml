name: CD

on:
  release:
    types: [published]            # publishing a release deploys production
  repository_dispatch:
    types: [promote-to-prod]      # Slack "Promote to Production" button deploys production
  push:
    branches: [develop]           # pushing develop deploys staging
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  deployments: write

concurrency: cd-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target environment
        id: t
        run: |
          case "${{ github.event_name }}" in
            release|repository_dispatch) PROD=1 ;;
            workflow_dispatch) [ "${{ inputs.environment }}" = "production" ] && PROD=1 || PROD=0 ;;
            *) PROD=0 ;;
          esac
          if [ "$PROD" = "1" ]; then
            echo "env=production" >> $GITHUB_OUTPUT
            echo "service=srv-daus6mvpn0mc738uq2i0" >> $GITHUB_OUTPUT
            echo "url=https://restaurant-backend-prod.onrender.com/graphql" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
            echo "service=srv-daus6mvpn0mc738uq2jg" >> $GITHUB_OUTPUT
            echo "url=https://restaurant-backend-staging.onrender.com/graphql" >> $GITHUB_OUTPUT
          fi
          echo "requested_by=${{ github.event.client_payload.requested_by || github.actor }}" >> $GITHUB_OUTPUT

      - name: Create GitHub deployment
        id: dep
        run: |
          id=$(curl -sf -X POST             -H "Authorization: Bearer ${{ github.token }}"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/${{ github.repository }}/deployments             -d "{\"ref\":\"${{ github.sha }}\",\"environment\":\"${{ steps.t.outputs.env }}\",\"auto_merge\":false,\"required_contexts\":[],\"description\":\"Deploy via ${{ github.event_name }} (by ${{ steps.t.outputs.requested_by }})\"}" | jq -r .id)
          echo "id=$id" >> $GITHUB_OUTPUT

      - name: Trigger Render deploy
        id: render
        run: |
          did=$(curl -sf -X POST             -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"             -H "Content-Type: application/json"             "https://api.render.com/v1/services/${{ steps.t.outputs.service }}/deploys"             -d '{"clearCache":"do_not_clear"}' | jq -r .id)
          echo "did=$did" >> $GITHUB_OUTPUT
          echo "Triggered Render deploy $did for ${{ steps.t.outputs.env }}"

      - name: Wait for Render deploy to go live
        id: wait
        run: |
          ok=false
          for i in $(seq 1 50); do
            st=$(curl -sf -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}"               "https://api.render.com/v1/services/${{ steps.t.outputs.service }}/deploys/${{ steps.render.outputs.did }}" | jq -r .status)
            echo "deploy status: $st"
            case "$st" in
              live) ok=true; break;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed) ok=false; break;;
            esac
            sleep 15
          done
          echo "ok=$ok" >> $GITHUB_OUTPUT

      - name: Report deployment status
        run: |
          state=$([ "${{ steps.wait.outputs.ok }}" = "true" ] && echo success || echo failure)
          curl -sf -X POST             -H "Authorization: Bearer ${{ github.token }}"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.dep.outputs.id }}/statuses             -d "{\"state\":\"$state\",\"environment\":\"${{ steps.t.outputs.env }}\",\"environment_url\":\"${{ steps.t.outputs.url }}\",\"description\":\"Render deploy $state\"}"
          [ "$state" = "success" ]

      - name: Announce deploy via Slack Workflow
        if: always()
        run: |
          state=$([ "${{ steps.wait.outputs.ok }}" = "true" ] && echo ":white_check_mark: succeeded" || echo ":x: failed")
          curl -sf -X POST -H "Content-Type: application/json"             "${{ secrets.SLACK_WORKFLOW_WEBHOOK }}"             -d "{\"message\":\":rocket: *${{ github.repository }}* → *${{ steps.t.outputs.env }}* deploy $state (by ${{ steps.t.outputs.requested_by }}, ${{ github.event_name }}) — ${{ steps.t.outputs.url }}\"}"             || echo "Slack workflow webhook post failed (non-fatal)"
