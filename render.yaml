# Render blueprint — backend (SQLite + REST + MCP + GraphQL), production + staging.
# Note: Render's free tier has an ephemeral filesystem, so the SQLite file resets
# on restart/redeploy. For durable data, attach a Render Disk and point DB_PATH at it.
services:
  - type: web
    name: restaurant-backend-prod
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: ./data/restaurant.db
      - key: NODE_AUTH_TOKEN
        sync: false
  - type: web
    name: restaurant-backend-staging
    runtime: node
    plan: free
    branch: develop
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DB_PATH
        value: ./data/restaurant.db
      - key: NODE_AUTH_TOKEN
        sync: false
